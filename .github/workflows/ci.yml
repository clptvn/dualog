name: Cross-platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install macOS runtime dependencies
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test native Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\windows-installer-smoke.ps1

      - name: Run test suite
        run: npm test

      - name: Smoke-test MCP wait tool
        run: npm run smoke:wait-tool
